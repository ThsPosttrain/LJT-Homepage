# Analytics
analytics: 

# Reading time
reading_time: false

# Comments
disqus:
  shortname: 

giscus:
  repo: 
  repo-id: 
  category: 
  category-id: 
  mapping: 
  reactions: 
  strict: 
  input-position: 
  theme: 
  lang: 
  loading: 

# Archive collections
collections:
  pages:
    output: true
    permalink: /:path/
  publications:
    output: true
    permalink: /publication/:path/
  teaching:
    output: false
    permalink: /teaching/:path/
  talks:
    output: false
    permalink: /talks/:path/
  portfolio:
    output: false
    permalink: /portfolio/:path/

# Pagination
paginate: 10
paginate_path: /page:num/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
